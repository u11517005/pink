<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>放學後社團體驗表｜游子誼</title><style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#fff7fa;color:#4a3940;line-height:1.8}
.page{width:min(900px,92%);margin:auto;padding:60px 0}.hero{background:linear-gradient(135deg,#ffeaf2,#f8eafa);border:1px solid #f3d2df;border-radius:28px;padding:42px 34px;margin-bottom:25px;box-shadow:0 15px 40px rgba(180,130,150,.1)}
.tag{color:#df82aa;font-weight:bold;letter-spacing:2px;font-size:.9rem}h1{margin:8px 0;color:#4a3940;font-size:clamp(2rem,6vw,3.3rem);line-height:1.2}
.hero p{color:#806b73}.card{background:#fff;border:1px solid #f1d4df;border-radius:22px;padding:28px;margin-bottom:22px;box-shadow:0 10px 30px rgba(170,110,135,.07)}
h2{color:#c86f99;margin-top:0}h3{color:#df82aa}p,li{color:#6f5962}.note{background:#fff0f6;border-left:4px solid #e995b8;border-radius:12px;padding:12px 16px}
table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid #efbfd2;border-radius:16px;background:#fff}
th{background:#ffeaf2;color:#a95f78}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #f2dce4}tr:last-child td{border-bottom:0}
input[type=text],select,textarea{width:100%;padding:12px;border:1px solid #efbfd2;border-radius:12px;background:#fffafd;font:inherit;color:#4a3940}
fieldset{border:1px solid #f1d4df;border-radius:16px;padding:18px;margin:20px 0;background:#fffafd}legend{color:#a95f78;font-weight:bold}
fieldset label{display:block;margin:7px 0;color:#6f5962}input{accent-color:#df82aa}
button{border:0;border-radius:100px;padding:12px 22px;background:#e995b8;color:white;font-weight:bold;opacity:.75}
footer{text-align:center;color:#b0919d;padding:25px 0}
@media(max-width:600px){.page{padding:35px 0}.hero,.card,form{padding:23px}}
</style></head>
<body><div class="page">
<header class="hero"><div class="tag">ACTIVITY 04 · HTML FORM</div><h1>放學後社團體驗表</h1></header>

<form class="card"><p><label for="nickname">我的暱稱</label><br><input type="text" id="nickname" name="nickname" placeholder="例如小星星"></p>
<p><label for="club">想體驗的社團</label><br><select id="club" name="club"><option value="">請選擇社團</option><option value="story">故事劇場</option><option value="science">科學手作</option><option value="boardgame">桌遊挑戰</option></select></p>
<fieldset><legend>方便參加的日子</legend><label><input type="radio" name="day" value="tuesday"> 星期二</label><label><input type="radio" name="day" value="thursday"> 星期四</label><label><input type="radio" name="day" value="friday"> 星期五</label></fieldset>
<fieldset><legend>我期待的活動方式</legend><label><input type="checkbox" name="activity" value="craft"> 動手製作</label><label><input type="checkbox" name="activity" value="cooperation"> 和同學合作</label><label><input type="checkbox" name="activity" value="share"> 上台分享</label></fieldset>
<p><label for="message">想告訴老師的事</label><br><textarea id="message" name="message" rows="5" placeholder="例如我想和同學一起完成一個小作品"></textarea></p>
<fieldset><legend>飲食特別需求（自訂欄位）</legend><label><input type="radio" name="diet" value="none" checked> 無特別限制</label><label><input type="radio" name="diet" value="vegetarian"> 素食</label><label><input type="radio" name="diet" value="allergy"> 對特定食物過敏（請在留言補充）</label></fieldset>
<p class="note">選擇這個元件的理由：因為點心時間需要了解學生的飲食習慣或過敏原，使用單選按鈕可以讓學生迅速選擇最符合的一項，確保活動安全。</p>
<p><button type="button" disabled>練習版，尚未開放報名</button></p></form>
<footer>數位科技概論｜ACTIVITY 04｜游子誼</footer>
</div></body></html>
