<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放學後社團體驗表</title>
</head>
<body>

  <h1>放學後社團體驗表</h1>
  <p>這是介面練習，資料不會送出或保存，不能當成正式報名。</p>

  <form>

    <!-- 2. 暱稱：單行文字欄位，提供持續可見的 label 與指定提示文字 -->
    <p>
      <label for="nickname">我的暱稱</label><br>
      <input type="text" id="nickname" name="nickname" placeholder="例如小星星">
    </p>

    <!-- 3. 社團：下拉選單，包含「請選擇社團」及三個有不同 value 的社團選項 -->
    <p>
      <label for="club">想體驗的社團</label><br>
      <select id="club" name="club">
        <option value="">請選擇社團</option>
        <option value="story">故事劇場</option>
        <option value="science">科學手作</option>
        <option value="boardgame">桌遊挑戰</option>
      </select>
    </p>

    <!-- 4. 日期：同組單選按鈕，使用 fieldset 與 legend 分組 -->
    <fieldset>
      <legend>方便參加的日子</legend>
      <label><input type="radio" name="day" value="tuesday"> 星期二</label><br>
      <label><input type="radio" name="day" value="thursday"> 星期四</label><br>
      <label><input type="radio" name="day" value="friday"> 星期五</label>
    </fieldset>

    <br>

    <!-- 5. 活動方式：複選方塊，使用 fieldset 與 legend 分組 -->
    <fieldset>
      <legend>我期待的活動方式</legend>
      <label><input type="checkbox" name="activity" value="craft"> 動手製作</label><br>
      <label><input type="checkbox" name="activity" value="cooperation"> 和同學合作</label><br>
      <label><input type="checkbox" name="activity" value="share"> 上台分享</label>
    </fieldset>

    <!-- 6. 留言：五行高的 textarea -->
    <p>
      <label for="message">想告訴老師的事</label><br>
      <textarea id="message" name="message" rows="5" placeholder="例如我想和同學一起完成一個小作品"></textarea>
    </p>

    <!-- 7. 自行設計的欄位：飲食需求（單選）與選擇理由 p -->
    <fieldset>
      <legend>飲食特別需求（自訂欄位）</legend>
      <label><input type="radio" name="diet" value="none" checked> 無特別限制</label><br>
      <label><input type="radio" name="diet" value="vegetarian"> 素食</label><br>
      <label><input type="radio" name="diet" value="allergy"> 對特定食物過敏（請在留言補充）</label>
    </fieldset>
    <p>選擇這個元件的理由：因為點心時間需要了解學生的飲食習慣或過敏原，使用單選按鈕可以讓學生迅速選擇最符合的一項，確保活動安全。</p>

    <!-- 9. 按鈕：type="button" disabled，文字為指定內容 -->
    <p>
      <button type="button" disabled>練習版，尚未開放報名</button>
    </p>

  </form>

</body>
</html>
